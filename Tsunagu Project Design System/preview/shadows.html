<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shadows</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; padding:0; background:var(--bg); }
  .card { box-sizing:border-box; padding:32px 28px; display:grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
  .item { display:flex; flex-direction:column; align-items:center; gap:10px; }
  .swatch { width: 100%; height: 80px; background: var(--washi-0); border:1px solid var(--line-100); border-radius: var(--r-md); }
  .label { font: 600 11px/1.2 var(--font-mono); color: var(--fg-2); letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="card">
  <div class="item"><div class="swatch" style="box-shadow: var(--shadow-sm)"></div><div class="label">--shadow-sm</div></div>
  <div class="item"><div class="swatch" style="box-shadow: var(--shadow-md)"></div><div class="label">--shadow-md</div></div>
  <div class="item"><div class="swatch" style="box-shadow: var(--shadow-lg)"></div><div class="label">--shadow-lg</div></div>
</div>
</body>
</html>
