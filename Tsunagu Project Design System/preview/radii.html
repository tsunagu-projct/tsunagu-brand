<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; padding:0; background:var(--bg); }
  .card { box-sizing:border-box; padding:24px 28px; display:grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .item { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .swatch { width: 100%; height: 90px; background: var(--ink-900); }
  .label { font: 600 11px/1.2 var(--font-mono); color: var(--fg-2); }
  .px { font: 500 10px/1.2 var(--font-mono); color: var(--fg-3); }
</style>
</head>
<body>
<div class="card">
  <div class="item"><div class="swatch" style="border-radius:0"></div><div class="label">--r-0</div><div class="px">0px</div></div>
  <div class="item"><div class="swatch" style="border-radius:var(--r-sm)"></div><div class="label">--r-sm</div><div class="px">4px</div></div>
  <div class="item"><div class="swatch" style="border-radius:var(--r-md)"></div><div class="label">--r-md</div><div class="px">8px</div></div>
  <div class="item"><div class="swatch" style="border-radius:var(--r-lg)"></div><div class="label">--r-lg</div><div class="px">16px</div></div>
  <div class="item"><div class="swatch" style="border-radius:var(--r-full); height:90px; width:90px; align-self:center"></div><div class="label">--r-full</div><div class="px">pill</div></div>
</div>
</body>
</html>
