<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Display type</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; padding:0; background:var(--bg); }
  .card { box-sizing:border-box; padding:28px 32px; }
  .row { display:flex; align-items:baseline; gap:16px; padding: 8px 0; border-bottom: 1px solid var(--line-100); }
  .row:last-child { border:0; }
  .meta { width: 100px; flex:none; font: 600 11px/1.2 var(--font-mono); color: var(--fg-3); letter-spacing:0.04em; }
  .sample { color: var(--fg-1); font-family: var(--font-display); font-weight:700; letter-spacing:-0.015em; line-height:1.05; }
</style>
</head>
<body>
<div class="card">
  <div class="row"><div class="meta">80 / Display</div><div class="sample" style="font-size:54px">つなぐ Project</div></div>
  <div class="row"><div class="meta">48 / H1</div><div class="sample" style="font-size:38px;font-weight:700">違いを、力に。</div></div>
  <div class="row"><div class="meta">38 / H2</div><div class="sample" style="font-size:30px;font-weight:600">Connecting people, ideas, tomorrow</div></div>
  <div class="row"><div class="meta">30 / H3</div><div class="sample" style="font-size:24px;font-weight:600">伴走者として、一緒に走る</div></div>
</div>
</body>
</html>
