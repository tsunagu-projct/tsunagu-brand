<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tsunagu Project — Note Feed</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="note-feed.css">
<style>
  body { margin: 0; background: var(--bg); }
  .demo-shell { min-height: 100vh; }
  .demo-divider {
    max-width: var(--container);
    margin: 0 auto;
    border-top: 1px dashed var(--line-200);
  }
  .demo-label {
    max-width: var(--container);
    margin: 0 auto;
    padding: var(--sp-7) var(--sp-5) 0;
    font-family: var(--font-mono);
    font-size: var(--fs-12);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fg-3);
  }
</style>
</head>
<body>
<div class="demo-shell">
  <div id="root"></div>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="demo-data.js"></script>
<script type="text/babel" src="NoteFeed.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "variant": "cards",
  "count": 3,
  "showThumb": true,
  "showExcerpt": true,
  "language": "ja"
}/*EDITMODE-END*/;

const COPY = {
  ja: {
    eyebrow: 'Latest from note',
    title: '最新の記事',
    sub: 'つなぐProjectの考えていること、書いたこと。',
    cta: 'noteで全記事を読む',
    read: '読む',
  },
  en: {
    eyebrow: 'Latest from note',
    title: 'Recent writing',
    sub: 'What Tsunagu Project is thinking and publishing.',
    cta: 'Read all on note',
    read: 'Read',
  },
};

const App = () => {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const copy = COPY[tweaks.language] || COPY.ja;

  return (
    <>
      <NoteFeed.Section
        articles={window.NOTE_FEED_DEMO}
        variant={tweaks.variant}
        count={tweaks.count}
        showThumb={tweaks.showThumb}
        showExcerpt={tweaks.showExcerpt}
        eyebrow={copy.eyebrow}
        title={copy.title}
        sub={copy.sub}
        ctaLabel={copy.cta}
        ctaHref="https://note.com/tsunagu_proj181"
        readLabel={copy.read}
      />

      <TweaksPanel title="Tweaks">
        <TweakSection title="Layout">
          <TweakRadio
            label="Variant"
            value={tweaks.variant}
            onChange={(v) => setTweak('variant', v)}
            options={[
              { value: 'cards', label: 'Cards' },
              { value: 'list', label: 'List' },
              { value: 'editorial', label: 'Editorial' },
            ]}
          />
          <TweakSlider
            label="Article count"
            value={tweaks.count}
            min={2} max={6} step={1}
            onChange={(v) => setTweak('count', v)}
          />
        </TweakSection>
        <TweakSection title="Content">
          <TweakToggle
            label="Show thumbnails"
            value={tweaks.showThumb}
            onChange={(v) => setTweak('showThumb', v)}
          />
          <TweakToggle
            label="Show excerpts"
            value={tweaks.showExcerpt}
            onChange={(v) => setTweak('showExcerpt', v)}
          />
        </TweakSection>
        <TweakSection title="Language">
          <TweakRadio
            label="Header copy"
            value={tweaks.language}
            onChange={(v) => setTweak('language', v)}
            options={[
              { value: 'ja', label: '日本語' },
              { value: 'en', label: 'English' },
            ]}
          />
        </TweakSection>
      </TweaksPanel>
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
