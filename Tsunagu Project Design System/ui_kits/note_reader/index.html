<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>違いを、力に。— つなぐProject</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="reader.css">
<link rel="icon" href="../../assets/favicon.svg">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="Components.jsx"></script>
<script type="text/babel">
  const { useState, useEffect } = React;
  function App() {
    const [liked, setLiked] = useState(false);
    const [saved, setSaved] = useState(false);
    useEffect(() => { window.lucide && window.lucide.createIcons(); });
    return (
      <div className="nr-page" data-screen-label="Note reader">
        <ReaderHeader/>
        <article className="nr-article">
          <Cover/>
          <span className="nr-eyebrow">伴走ノート · #003</span>
          <h1 className="nr-title">違いを、力に。<br/>多国籍チームで20年、たどり着いた三つの問い。</h1>
          <p className="nr-subtitle">A near-60 PM on the small, daily practice of turning difference into momentum — with people, with AI, and with yourself.</p>
          <Byline liked={liked} onLike={() => setLiked(v=>!v)} saved={saved} onSave={() => setSaved(v=>!v)}/>
          <ArticleBody/>
          <Divider/>
          <div className="nr-tags">
            <a className="nr-tag" href="#">#伴走</a>
            <a className="nr-tag" href="#">#AI活用</a>
            <a className="nr-tag" href="#">#キャリア</a>
            <a className="nr-tag" href="#">#多国籍チーム</a>
          </div>
          <Related/>
        </article>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
