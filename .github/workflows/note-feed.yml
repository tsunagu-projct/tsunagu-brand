name: Update note feed

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch note RSS
        run: node scripts/fetch-notes.cjs

      - name: Commit if changed
        run: |
          git config user.name  "tsunagu-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add notes.json
          if git diff --staged --quiet; then
            echo "No change."
          else
            git commit -m "chore: update note feed"
            git push
          fi
